<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark glossy background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2D1B69;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4C1D95;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1F2937;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="silverGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E5E7EB;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F3F4F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D1D5DB;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" fill="url(#bgGradient)" rx="80"/>
  
  <!-- Silver Scissors -->
  <g transform="translate(80, 200)">
    <!-- Left blade -->
    <path d="M-40,-25 L-15,-45 L15,-25 L-15,-5 Z" fill="url(#silverGradient)" stroke="#9CA3AF" stroke-width="2"/>
    <!-- Right blade -->
    <path d="M40,-25 L15,-45 L-15,-25 L15,-5 Z" fill="url(#silverGradient)" stroke="#9CA3AF" stroke-width="2"/>
    <!-- Handle -->
    <ellipse cx="0" cy="0" rx="12" ry="8" fill="url(#silverGradient)" stroke="#9CA3AF" stroke-width="2"/>
    <!-- Pivot screw -->
    <circle cx="0" cy="0" r="3" fill="#6B7280"/>
  </g>
  
  <!-- Stylized "M" -->
  <g transform="translate(200, 150)">
    <!-- Left half - Purple -->
    <path d="M0,0 L0,120 L30,120 L30,60 L60,60 L60,120 L90,120 L90,0 L60,0 L60,60 L30,60 L30,0 Z" fill="url(#purpleGradient)"/>
    <!-- Right half - Silver -->
    <path d="M90,0 L90,120 L120,120 L120,60 L150,60 L150,120 L180,120 L180,0 L150,0 L150,60 L120,60 L120,0 Z" fill="url(#silverGradient)"/>
  </g>
  
  <!-- Stylized "C" -->
  <g transform="translate(280, 200)">
    <!-- Outer C - Silver -->
    <path d="M0,0 L80,0 L80,20 L20,20 L20,80 L80,80 L80,100 L0,100 Z" fill="url(#silverGradient)"/>
    <!-- Inner C - Purple -->
    <path d="M20,20 L60,20 L60,40 L40,40 L40,60 L60,60 L60,80 L20,80 Z" fill="url(#purpleGradient)"/>
  </g>
</svg>
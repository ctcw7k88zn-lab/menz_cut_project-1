<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1F2937;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="scissors" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E5E7EB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9CA3AF;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  
  <!-- Diagonal lines background -->
  <g opacity="0.1">
    <line x1="0" y1="0" x2="512" y2="512" stroke="white" stroke-width="2"/>
    <line x1="0" y1="128" x2="384" y2="512" stroke="white" stroke-width="1"/>
    <line x1="0" y1="256" x2="256" y2="512" stroke="white" stroke-width="1"/>
  </g>
  
  <!-- Speech bubble/tag shape -->
  <rect x="280" y="180" width="180" height="120" rx="20" fill="url(#scissors)" opacity="0.9"/>
  
  <!-- Circuit board pattern inside the tag -->
  <g fill="#374151" opacity="0.7">
    <!-- Horizontal lines -->
    <rect x="300" y="200" width="60" height="2"/>
    <rect x="300" y="220" width="80" height="2"/>
    <rect x="300" y="240" width="50" height="2"/>
    <rect x="300" y="260" width="70" height="2"/>
    <rect x="300" y="280" width="40" height="2"/>
    
    <!-- Vertical lines -->
    <rect x="320" y="200" width="2" height="80"/>
    <rect x="360" y="200" width="2" height="80"/>
    <rect x="400" y="200" width="2" height="80"/>
    
    <!-- Circles -->
    <circle cx="320" cy="220" r="3"/>
    <circle cx="360" cy="240" r="3"/>
    <circle cx="400" cy="260" r="3"/>
    <circle cx="320" cy="280" r="3"/>
  </g>
  
  <!-- AI text -->
  <text x="370" y="250" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="url(#scissors)" text-anchor="middle">AI</text>
  
  <!-- Scissors -->
  <g transform="translate(150, 200) rotate(-15)">
    <!-- Left blade -->
    <path d="M 0 0 L 80 -20 L 100 0 L 80 20 Z" fill="url(#scissors)"/>
    <!-- Right blade -->
    <path d="M 0 0 L 80 20 L 100 0 L 80 -20 Z" fill="url(#scissors)"/>
    <!-- Handle -->
    <ellipse cx="0" cy="0" rx="8" ry="25" fill="url(#scissors)"/>
    <!-- Handle hole -->
    <ellipse cx="0" cy="0" rx="4" ry="15" fill="#1F2937"/>
  </g>
  
  <!-- Cutting effect - scissors cutting into the tag -->
  <path d="M 280 240 L 300 240" stroke="#8B5CF6" stroke-width="3" stroke-linecap="round"/>
</svg>

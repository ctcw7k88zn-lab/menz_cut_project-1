<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6B46C1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1C1C1E;stop-opacity:1" />
    </linearGradient>
    
    <!-- Metallic gradient for scissors and AI -->
    <linearGradient id="metallicGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8E8E8;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#C0C0C0;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#A0A0A0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#808080;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#bgGradient)"/>
  
  <!-- Circuit board shape (cut by scissors) -->
  <path d="M 200 120 L 420 120 L 420 200 L 400 200 L 400 180 L 380 180 L 380 200 L 360 200 L 360 180 L 340 180 L 340 200 L 320 200 L 320 180 L 300 180 L 300 200 L 280 200 L 280 180 L 260 180 L 260 200 L 240 200 L 240 180 L 220 180 L 220 200 L 200 200 Z" 
        fill="url(#metallicGradient)" 
        filter="url(#glow)"/>
  
  <!-- Circuit board pattern inside -->
  <g fill="#FFFFFF" opacity="0.8">
    <!-- Horizontal lines -->
    <rect x="220" y="140" width="60" height="2" rx="1"/>
    <rect x="300" y="140" width="80" height="2" rx="1"/>
    <rect x="240" y="160" width="100" height="2" rx="1"/>
    <rect x="320" y="180" width="60" height="2" rx="1"/>
    
    <!-- Vertical lines -->
    <rect x="280" y="140" width="2" height="40" rx="1"/>
    <rect x="340" y="140" width="2" height="40" rx="1"/>
    <rect x="380" y="160" width="2" height="20" rx="1"/>
    
    <!-- Connection dots -->
    <circle cx="280" cy="140" r="3"/>
    <circle cx="340" cy="140" r="3"/>
    <circle cx="380" cy="160" r="3"/>
    <circle cx="240" cy="160" r="3"/>
    <circle cx="320" cy="180" r="3"/>
  </g>
  
  <!-- AI Text -->
  <g fill="url(#metallicGradient)" font-family="Arial, sans-serif" font-weight="bold" font-size="48">
    <text x="250" y="200" text-anchor="middle">AI</text>
  </g>
  
  <!-- Scissors -->
  <g transform="translate(120, 200)">
    <!-- Left blade -->
    <path d="M 0 0 L 80 -40 L 100 -20 L 20 20 Z" 
          fill="url(#metallicGradient)" 
          filter="url(#glow)"/>
    
    <!-- Right blade -->
    <path d="M 0 0 L 80 40 L 100 20 L 20 -20 Z" 
          fill="url(#metallicGradient)" 
          filter="url(#glow)"/>
    
    <!-- Pivot point -->
    <circle cx="0" cy="0" r="8" fill="#404040"/>
    
    <!-- Handles -->
    <circle cx="-20" cy="-15" r="12" fill="url(#metallicGradient)"/>
    <circle cx="-20" cy="15" r="12" fill="url(#metallicGradient)"/>
  </g>
  
  <!-- Cutting effect - jagged edge where scissors cut -->
  <path d="M 200 120 L 200 140 L 195 145 L 200 150 L 195 155 L 200 160 L 195 165 L 200 170 L 195 175 L 200 180 L 195 185 L 200 190 L 195 195 L 200 200" 
        fill="url(#metallicGradient)" 
        opacity="0.9"/>
</svg>
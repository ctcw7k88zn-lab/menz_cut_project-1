<?xml version="1.0" encoding="UTF-8"?>
<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1F2937;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="scissors" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E5E7EB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9CA3AF;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="32" height="32" rx="5" fill="url(#bg)"/>
  
  <!-- Speech bubble/tag shape -->
  <rect x="18" y="12" width="12" height="8" rx="2" fill="url(#scissors)" opacity="0.9"/>
  
  <!-- Circuit board pattern -->
  <g fill="#374151" opacity="0.7">
    <rect x="20" y="13" width="4" height="1"/>
    <rect x="20" y="15" width="6" height="1"/>
    <rect x="20" y="17" width="3" height="1"/>
    <rect x="22" y="13" width="1" height="6"/>
    <rect x="26" y="13" width="1" height="6"/>
    <circle cx="22" cy="15" r="0.5"/>
    <circle cx="26" cy="17" r="0.5"/>
  </g>
  
  <!-- AI text -->
  <text x="24" y="18" font-family="Arial, sans-serif" font-size="4" font-weight="bold" fill="url(#scissors)" text-anchor="middle">AI</text>
  
  <!-- Scissors -->
  <g transform="translate(10, 12) rotate(-15)">
    <path d="M 0 0 L 5 -1 L 6 0 L 5 1 Z" fill="url(#scissors)"/>
    <path d="M 0 0 L 5 1 L 6 0 L 5 -1 Z" fill="url(#scissors)"/>
    <ellipse cx="0" cy="0" rx="0.5" ry="1.5" fill="url(#scissors)"/>
    <ellipse cx="0" cy="0" rx="0.25" ry="1" fill="#1F2937"/>
  </g>
</svg>
